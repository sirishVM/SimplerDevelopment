<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo Icon -->
  <circle cx="150" cy="200" r="30" fill="white" opacity="0.9"/>
  <rect x="135" y="185" width="30" height="30" rx="6" fill="#3b82f6"/>
  
  <!-- Main Title -->
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#textGradient)">
    AI Blog Automation
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.9)">
    Save 25+ Hours Per Week
  </text>
  
  <!-- Description -->
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">
    Automate content creation, optimization &amp; publishing to Wix
  </text>
  
  <!-- Brand Name -->
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">
    Hatrio AI
  </text>
  
  <!-- CTA Badge -->
  <rect x="60" y="480" width="200" height="50" rx="25" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <text x="160" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
    Start Free Trial
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="950" cy="150" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1050" cy="250" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="900" cy="400" r="100" fill="rgba(255,255,255,0.06)"/>
  
  <!-- AI/Bot Icon -->
  <rect x="850" y="300" width="60" height="60" rx="12" fill="rgba(255,255,255,0.2)"/>
  <circle cx="865" cy="320" r="4" fill="white"/>
  <circle cx="895" cy="320" r="4" fill="white"/>
  <rect x="870" y="335" width="20" height="8" rx="4" fill="white"/>
</svg>